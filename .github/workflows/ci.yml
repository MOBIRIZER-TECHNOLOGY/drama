name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: katha
          POSTGRES_PASSWORD: katha
          POSTGRES_DB: katha_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U katha" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      KATHA_DATABASE_URL: postgresql+asyncpg://katha:katha@localhost:5432/katha_test
      KATHA_TEST_DATABASE_URL: postgresql+asyncpg://katha:katha@localhost:5432/katha_test
      KATHA_JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      KATHA_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: api deps
        working-directory: services/api
        run: uv sync --extra dev --extra ai
      - name: api lint
        working-directory: services/api
        run: uv run ruff check . && uv run ruff format --check .
      - name: api migrate
        working-directory: services/api
        run: uv run alembic upgrade head
      - name: api migration is in sync with models
        working-directory: services/api
        run: uv run alembic check
      # --cov-fail-under is the point of these three steps. Coverage that is measured but not enforced drifts
      # down one merge at a time and nobody sees it happen; a threshold makes the drop the thing that fails.
      # The floors sit just under where each package stands, so a real regression trips them and ordinary
      # churn does not.
      - name: api tests
        working-directory: services/api
        run: uv run --with pytest-cov pytest -q --cov=app --cov-report=term --cov-fail-under=95
      - name: ai deps and tests
        working-directory: services/ai
        run: uv sync --extra dev && uv run ruff check . && uv run ruff format --check . && uv run --with pytest-cov pytest -q --cov=katha_ai --cov-report=term --cov-fail-under=99
      - name: worker deps and tests
        working-directory: services/worker
        run: uv sync --extra dev && uv run ruff check . && uv run ruff format --check . && uv run --with pytest-cov pytest -q --cov=worker --cov-report=term --cov-fail-under=99
      - name: openapi export matches committed client schema
        working-directory: services/api
        run: |
          uv run python scripts/export_openapi.py /tmp/openapi.json
          diff -q /tmp/openapi.json ../../packages/api-client/openapi.json

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4  # version comes from package.json's packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @katha/api-client generate
      # The generated client is committed so editors and CI agree on the types. Regenerating in CI only helps
      # if a stale commit is refused rather than silently overwritten.
      - name: generated client is committed
        run: git diff --exit-code -- packages/api-client/src/schema.d.ts
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present lint
      # The thresholds live in each app's vitest.config.ts (95% on every metric), so a drop fails the step.
      - name: web unit tests with coverage
        run: pnpm --filter web test:coverage
      - name: admin unit tests with coverage
        run: pnpm --filter admin test:coverage
      # One key means one English string across both clients: they share the server's translation table, so a
      # key that says "Retry" on mobile and "Try again" on web is one row each will overwrite for the other.
      - name: i18n catalogue is current and consistent
        run: pnpm i18n:check
