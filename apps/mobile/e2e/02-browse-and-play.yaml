# The catalogue, a series, and playback on a device against the real API and AES-128 encrypted media.
#
# No `clearState`: this runs after onboarding and reuses its state, which is also how a returning viewer
# arrives. Run the folder in order, or run 01 first.
appId: com.mobirizer.katha
name: Browse and play
# The series the flow drives comes from the runner (`maestro test -e SERIES_TITLE=...`, which
# scripts/e2e-ios.sh and e2e-android.sh pass from the API's e2e seeder); an unset one fails the flow loudly.
---
# Stopped first: on iOS `launchApp` alone brings a backgrounded app forward on whatever screen it was left,
# where Android restarts it. A cold start is what "a returning viewer opens the app" means on both.
- stopApp
- launchApp

- assertVisible: "Katha"
- assertVisible:
    text: ".*${SERIES_TITLE}.*"

# The bottom tabs are the whole of the app's navigation. iOS labels a tab "Home, tab, 1 of 4"; Android
# exposes the bare name; the optional group matches either.
- assertVisible:
    text: "Home(, tab.*)?"
- assertVisible:
    text: "Shorts(, tab.*)?"
- assertVisible:
    text: "My List(, tab.*)?"
- assertVisible:
    text: "Me(, tab.*)?"

- tapOn:
    text: "${SERIES_TITLE}"

# The series screen states the deal before anyone spends anything: how many episodes, how many are free,
# and what the rest cost.
- assertVisible:
    text: "${SERIES_TITLE}"
# Wrapped in `.*` because Maestro matches the whole text of a node, and this line is one node:
# "10 episodes · 1 free · 77 views".
- assertVisible:
    text: ".*[0-9]+ episodes.*"
- assertVisible: "Play"
- assertVisible: "Episodes"
# The free count is part of the header line, and the first tile carries no "locked" suffix in its label
# ("Episode 1" against "Episode 2, locked"); the "Free" badge is not a node of its own on iOS.
- assertVisible:
    text: ".*[0-9]+ free.*"
- assertVisible:
    text: "Episode 1(, free)?"
- assertVisible:
    text: ".*([0-9]+ coins each|Unlock all).*"

- tapOn: "Play"
- tapOn:
    text: "Got it"
    optional: true

# The controls are up when the player mounts, so the clock is readable here; it fades a few seconds later,
# which is why this is asserted immediately rather than after a wait.
- extendedWaitUntil:
    visible:
      text: ".*[0-9]:[0-9][0-9].*"
    timeout: 40000

# The states a broken stream lands in. The page looks the same either way, so these are the assertions that
# separate "the player mounted" from "the viewer is watching".
- assertNotVisible:
    text: ".*(Playback stopped|Couldn.t load|Try again|Something went wrong).*"
