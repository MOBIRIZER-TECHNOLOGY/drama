[project]
name = "katha-worker"
version = "0.1.0"
description = "Katha background jobs: transcoding, webhooks fan-out, push, AI graphs"
requires-python = ">=3.12"
dependencies = [
  "arq>=0.26",
  "redis>=5.0",
  "httpx>=0.27",
  "structlog>=24.1",
  "pydantic-settings>=2.4",
  "boto3>=1.34",
  "katha-api",
  "katha-ai",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.uv.sources]
katha-api = { path = "../api", editable = true }
katha-ai = { path = "../ai", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
