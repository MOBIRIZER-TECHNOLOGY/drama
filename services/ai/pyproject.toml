[project]
name = "katha-ai"
version = "0.1.0"
description = "Katha LangGraph graphs: content ingestion, translation, subtitles, recommendations"
requires-python = ">=3.12"
dependencies = [
  "langchain>=0.3",
  "langchain-core>=0.3",
  "langgraph>=0.3",
  "langchain-anthropic>=0.3",
  "langchain-openai>=0.3",
  "langchain-google-genai>=2.0",
  "langchain-groq>=0.2",
  "langchain-voyageai>=0.1",
  "langchain-ollama>=0.2",
  "openai>=1.50",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "structlog>=24.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["katha_ai"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
