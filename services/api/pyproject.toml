[project]
name = "katha-api"
version = "0.1.0"
description = "Katha short-drama streaming API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pyjwt[crypto]>=2.9",
  "pwdlib[argon2]>=0.2",
  "firebase-admin>=6.5",
  "redis>=5.0",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "orjson>=3.10",
  "structlog>=24.1",
  "stripe>=11.0",
  "boto3>=1.34",
  "arq>=0.26",
  "nh3>=0.2",
  # zoneinfo reads the IANA database from the OS, which Windows and slim/distroless
  # containers do not ship. Without it ZoneInfo("Asia/Kolkata") raises and the daily
  # check-in rollover and streak reminders crash. Carry the database with us.
  "tzdata>=2024.1",
  "slowapi>=0.1.9",
  "aiosmtplib>=3.0",
  "sentry-sdk[fastapi]>=2.0",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
  "opentelemetry-instrumentation-fastapi>=0.46b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
  "opentelemetry-instrumentation-httpx>=0.46b0",
]

[project.optional-dependencies]
ai = ["katha-ai"]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[tool.uv.sources]
katha-ai = { path = "../ai", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["UP042", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
