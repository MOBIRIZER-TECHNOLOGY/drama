# Media edge for self-hosted deployments (cdn_signing_mode=hmac).
# Fronts the private bucket; every request under /media/hls/ and /media/uploads/ must carry a valid grant.
# Public prefixes (images, avatars, subtitles) are served without a check.

upstream katha_api { server api:8000; }
upstream katha_bucket { server minio:9000; }

proxy_cache_path /var/cache/nginx/media levels=1:2 keys_zone=media:50m max_size=20g inactive=7d use_temp_path=off;

server {
  listen 8080;
  server_name _;

  location = /_verify {
    internal;
    proxy_pass http://katha_api/v1/media/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $request_uri;
  }

  # Protected: HLS renditions and original uploads.
  location ~ ^/media/(hls|uploads)/ {
    # CORS headers first: they apply to the preflight below as well as to the proxied response.
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Range" always;
    add_header Access-Control-Expose-Headers "Content-Length,Content-Range" always;
    add_header Access-Control-Max-Age "86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "private, max-age=0" always;   # browser must re-validate; edge cache serves
    add_header X-Cache $upstream_cache_status;

    # A browser's preflight carries no grant, and the verify hop would refuse it. `if` runs in the rewrite
    # phase, before auth_request, so the preflight is answered here without ever reaching the API.
    if ($request_method = OPTIONS) { return 204; }

    auth_request /_verify;
    auth_request_set $auth_status $upstream_status;
    rewrite ^/media/(.*)$ /katha-media/$1 break;
    proxy_pass http://katha_bucket;
    proxy_set_header Host minio:9000;
    proxy_cache media;
    proxy_cache_key $uri;                 # cache by path only; the grant query varies per user
    proxy_cache_valid 200 7d;
    proxy_cache_lock on;                  # one origin fetch per segment when a burst of players miss together
    proxy_ignore_headers Set-Cookie;
  }

  # Public: covers, avatars, subtitle tracks.
  location ~ ^/media/(images|avatars|subtitles)/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "public, max-age=86400" always;
    if ($request_method = OPTIONS) { return 204; }

    rewrite ^/media/(.*)$ /katha-media/$1 break;
    proxy_pass http://katha_bucket;
    proxy_set_header Host minio:9000;
    proxy_cache media;
    proxy_cache_valid 200 30d;
    proxy_cache_lock on;
  }

  location / { return 404; }
}
