name: katha

# Published ports bind to loopback: these services carry default credentials and a laptop on café wifi should
# not be offering its Postgres to the room. A physical device on the LAN reaching the media edge or MinIO
# needs the binding widened for that one service, deliberately.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: katha
      POSTGRES_PASSWORD: katha
      POSTGRES_DB: katha
    ports: ["127.0.0.1:${KATHA_POSTGRES_PORT:-5432}:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katha"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:${KATHA_REDIS_PORT:-6379}:6379"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: katha
      MINIO_ROOT_PASSWORD: katha-secret
      # Presigned PUTs and (via nginx's /media/ proxy) HLS/image fetches come straight from the admin and
      # web origins — local dev ones, plus the aicanon.dev deployment's, since a browser enforces CORS on
      # cross-origin media the same way it enforces mixed-content on http:// media from an https:// page.
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:3000,http://localhost:3001,https://aicanon.dev,https://www.aicanon.dev,https://admin.aicanon.dev,https://api.aicanon.dev"
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["minio:/data"]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 katha katha-secret; do sleep 1; done;
      mc mb --ignore-existing local/katha-media;
      mc anonymous set download local/katha-media/images;
      mc anonymous set download local/katha-media/avatars;
      mc anonymous set download local/katha-media/subtitles;
      mc anonymous set download local/katha-media/hls;
      mc anonymous set download local/katha-media/developer-seed;
      mc anonymous set download local/katha-media/media;
      exit 0"

  media-edge:
    image: nginx:1.27-alpine
    depends_on: [minio]
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ../nginx/media.conf:/etc/nginx/conf.d/default.conf:ro
      - mediacache:/var/cache/nginx/media
    extra_hosts: ["api:host-gateway"]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]

volumes:
  pgdata:
  minio:
  mediacache:
